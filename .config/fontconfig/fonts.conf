<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>

 <alias>
   <family>sans-serif</family>
   <prefer>
     <family>LazyFox Pixel Font 4w</family>
     <family>MesloLGS Nerd Font</family>
   </prefer> 
 </alias>

 <alias>
   <family>serif</family>
   <prefer>
     <family>LazyFox Pixel Font 4w</family>
     <family>MesloLGS Nerd Font</family>
   </prefer>
 </alias>

 <alias>
  <family>monospace</family>
  <prefer>
    <family>Monaspace Krypton Wide</family>
    <family>MesloLGS Nerd Font Mono</family>
   </prefer>
 </alias>
</fontconfig>


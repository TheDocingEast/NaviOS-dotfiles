source = ~/.config/hypr/config/UI/myColors.conf
general {
  gaps_in = 6
  gaps_out = 10
  float_gaps = 5
  border_size = 3

  col.active_border = rgb($blue) rgb($background) 135deg
  col.inactive_border =  rgb($background) rgb($blue) 135deg
  # col.inactive_border = rgb($surface) 130deg
  allow_tearing = false
  layout = dwindle
  hover_icon_on_border = true

  snap {
    enabled = true

  }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 15
  rounding_power = 0

  dim_modal = true
  active_opacity = 1.0
  inactive_opacity = 0.9

  blur {
    enabled = true
    new_optimizations = true
    popups = true
    size = 10
    passes = 1
    brightness = 1.3
    contrast = 1
    vibrancy = 0.2
    vibrancy_darkness = 0.4
  }
}

source = ~/.config/hypr/config/myColors.conf
#
############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# Cursor
env = HYPRCURSOR_THEME,Nordzy-hyprcursors
env = no_hardware_cursors,1
env = HYPRCURSOR_SIZE,30
env = XCURSOR_THEME,Nordzy-cursors
env = XCURSOR_SIZE,30
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Nordzy-cursors'

# General Hyprland
env = HYPRLAND_NO_SD_NOTIFY,1
env = HYPRSHOT_DIR,$HOME/Pictures/Hyprshot

#QT theme
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORM,wayland;# hyprland.conf
env = QT_QPA_PLATFORMTHEME,qt6ct

# Nvidia specific 
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,0
env = __GL_GSYNC_ALLOWED,1
env = LIBVA_DRIVER_NAME,nvidia

# For GTK3/4 themes (replace with your theme name)
env = GDK_BACKEND,wayland,x11
env = GTK_THEME,Nordic-darker
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# XDG
env = XDG_CURRENT_DESKTOP="Hyprland";
env = XDG_SESSION_TYPE="wayland";
env = XDG_SESSION_DESKTOP="Hyprland";

# Japanese
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx

# monitor
exec-once = xrandr --output DP-2 --primary

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 1920x1080@60, 0x0, 1, vrr, 2
monitor = DP-2, 1920x1080@165, 0x0, 1, vrr, 2
monitor = HDMI-A-1, 1920x1080@60, 1920x20, 1, vrr, 2

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = rofi -show combi
$conf = $HOME/.config/hypr/


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = dbus-update-activation-environment --systemd --all systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = blueman-applet & connex --tray-only
exec-once = awww-daemon & systemctl --user enable opentabletdriver.service --now & nm-applet & swaync 
exec-once = hypridle
exec-once = nekoray
exec-once = qs
exec-once = systemctl --user start hyprpolkitagent
exec-once = telegram-desktop -startintray
exec-once = fcitx5 -d
exec-once = systemctl --user import-environment GTK_IM_MODULE QT_IM_MODULE XMODIFIERS
exec-once = ~/.config/hypr/scripts/setup_audio.sh

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/discord, screencopy, allow
permission = /usr/(bin|local/bin)/steam, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
  gaps_in = 6
  gaps_out = 10
  float_gaps = 5
  border_size = 3

  col.active_border = rgb($blue) rgb($background) 130deg
  col.inactive_border = rgb($surface)
  allow_tearing = false
  layout = dwindle
  hover_icon_on_border = true

  snap {
    enabled = true

  }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 15
  rounding_power = 1

  dim_modal = true
  active_opacity = 1.0
  inactive_opacity = 0.9

  shadow {
    enabled = true
    range = 5
    render_power = 4
    color = rgb($shadow)
    color_inactive = rgb($blue)
    offset = 2 2
  }
  blur {
    enabled = true
    new_optimizations = true
    popups = true
    size = 10
    passes = 1
    brightness = 1.3
    contrast = 1
    vibrancy = 0.2
    vibrancy_darkness = 0.4
  }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic, 0.21, 0.61, 0.35, 1.00
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = overshoot, 0.68, -0.55, 0.27, 1.55 
    bezier = easeInOutExpo, 0.19, 1.00, 0.22, 1.00
    bezier = easeInQuint, 0.76, 0.05, 0.85, 0.06
    bezier = easeInCirc, 0.60, 0.04, 0.98, 0.34
    bezier = easeInOutSlit, 0.45, 0.05, 0.55, 0.95

    animation = global, 1, 10, quick
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 2.3, overshoot, slide
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, easeInOutSlit, slidefade
    animation = workspacesIn, 1, 1.21, easeInOutSlit
    animation = workspacesOut, 1, 1.94, easeInCirc
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    smart_split = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
  disable_scale_notification = true
  font_family = Monaspace Krypton Frozen
  vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  animate_manual_resizes = false
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant = 
    kb_model = 
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

opengl {
  nvidia_anti_flicker = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}
# https://wiki.hypr.land/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, exec, $conf/scripts/killactive.sh
bind = $mainMod SHIFT, C, forcekillactive, 
bind = $mainMod, W, exec, $HOME/bin/waybar.sh
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy
bind = $mainMod, F, togglefloating,
bind = $mainMod, K, fullscreen,
bind = ALT, SPACE, exec, $menu
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = $mainMod SHIFT, R, exec, hyprctl reload

bind = $mainMod, L, exec, hyprlock
bind = $mainMod, R, exec, quickshell -p ~/.config/quickshell/wallpaperPicker
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen

# color picker
bind = CTRL $mainMod, C, exec, hyprpicker -a -f hex

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Montior DP-1 (primary)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Monitor HDMI-A-1 (secondary)
bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20

# Move in primary monitor workspace
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move in secondary monitor workspace
bind = $mainMod CTRL SHIFT, 1, movetoworkspacesilent, 11
bind = $mainMod CTRL SHIFT, 2, movetoworkspacesilent, 12
bind = $mainMod CTRL SHIFT, 3, movetoworkspacesilent, 13
bind = $mainMod CTRL SHIFT, 4, movetoworkspacesilent, 14
bind = $mainMod CTRL SHIFT, 5, movetoworkspacesilent, 15
bind = $mainMod CTRL SHIFT, 6, movetoworkspacesilent, 16
bind = $mainMod CTRL SHIFT, 7, movetoworkspacesilent, 17
bind = $mainMod CTRL SHIFT, 8, movetoworkspacesilent, 18
bind = $mainMod CTRL SHIFT, 9, movetoworkspacesilent, 19
bind = $mainMod CTRL SHIFT, 0, movetoworkspacesilent, 20
# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ 
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- 
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle 
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ 
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

windowrule = suppress_event maximize, match:class .*0windowrulev2=nofocus, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
windowrule = opacity 0.0 override, no_anim on, no_initial_focus on, max_size 1 1, no_blur on, no_focus on, match:class ^(xwaylandvideobridge)$

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
windowrule = immediate 1, match:class ^(FreeCAD)$

# Primary monitor for laptop workspace
#workspace = 1, monitor:eDP-1
#workspace = 2, monitor:eDP-1
#workspace = 3, monitor:eDP-1
#workspace = 4, monitor:eDP-1
#workspace = 5, monitor:eDP-1
#workspace = 6, monitor:eDP-1
#workspace = 7, monitor:eDP-1
#workspace = 8, monitor:eDP-1
#workspace = 9, monitor:eDP-1
#workspace = 10, monitor:eDP-1


# Primary monitor workspace
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2


# Secondary monitor workspace
workspace = 11, monitor:HDMI-A-1
workspace = 12, monitor:HDMI-A-1
workspace = 13, monitor:HDMI-A-1
workspace = 14, monitor:HDMI-A-1
workspace = 15, monitor:HDMI-A-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1
